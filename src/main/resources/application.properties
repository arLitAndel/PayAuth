spring.application.name=PayAuth

#Tomcat
server.port=8080

# MariaDB ?? ??
spring.datasource.url=jdbc:mariadb://localhost:3306/PayAuthDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=payAuth
spring.datasource.password=***REMOVED***
spring.jpa.hibernate.ddl-auto=update

#????
jasypt.encryptor.password=${JASYPT_SECRET_KEY}
# ??? ????
jasypt.encryptor.algorithm=PBEWithMD5AndDES

#CoolSMS (일반 SMS 발송용 - 알림/공지 등)
coolsms.api-key=${COOLSMS_API_KEY}
coolsms.api-secret=${COOLSMS_API_SECRET}
coolsms.sender=${COOLSMS_SENDER}

# 본인인증 모듈 선택 (운영 기본값: danal / 옵션: kcb)
identity-verification.provider=danal

# 다날 본인인증 설정
identity-verification.danal.cp-id=${DANAL_CP_ID:}
identity-verification.danal.api-key=${DANAL_API_KEY:}
identity-verification.danal.callback-url=${DANAL_CALLBACK_URL:}

# KCB 본인인증 설정
identity-verification.kcb.site-code=${KCB_SITE_CODE:}
identity-verification.kcb.license-key=${KCB_LICENSE_KEY:}
identity-verification.kcb.api-url=${KCB_API_URL:}

spring.profiles.active=local